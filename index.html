<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💜 REHAN & JANNAT - Pro Music Studio</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #1b1f2c 0%, #0d0f14 100%); color: #ffffff; min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; position: relative; }
        
        .sw-container { width:100%; max-width:480px; margin: 0 auto; padding: 16px; position: relative; z-index: 2; }
        .glass-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); }
        .tap-animate { transition: transform 0.15s ease-out; cursor: pointer; }
        .tap-animate:active { transform: scale(0.95) !important; }
        
        /* TOP HEADER */
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .nav-back-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }
        .brand-title { font-size:18px; font-weight:800; background: linear-gradient(45deg, #fff, #a29bfe, #fd79a8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* SEARCH BAR */
        .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #fff; font-size: 14px; outline: none; }
        .search-btn { padding: 12px 18px; border-radius: 14px; border: none; background: linear-gradient(45deg, #6c5ce7, #fd79a8); color: #fff; font-weight: 700; cursor: pointer; }

        /* TABS */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.08); font-size: 12px; font-weight: 700; color: #a29bfe; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .tab-btn.active { background: linear-gradient(45deg, #6c5ce7, #fd79a8); color: #fff; border: none; }

        /* SONG CARD */
        .song-card { padding: 12px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
        .song-info { display: flex; align-items: center; gap: 12px; width: 75%; min-width: 0; }
        .song-cover { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #222; flex-shrink: 0; }
        
        .song-details { width: 100%; min-width: 0; }
        .song-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .song-sub { font-size: 11px; color: #8a96a3; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .like-icon { font-size: 18px; color: rgba(255,255,255,0.3); transition: color 0.2s; cursor: pointer; }
        .like-icon.active { color: #fd79a8; }

        /* MINI PLAYER BAR */
        .mini-player-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 450px; border-radius: 20px; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; z-index: 95; cursor: pointer; background: rgba(23, 27, 38, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.15); }
        .mini-player-top { display: flex; align-items: center; justify-content: space-between; }
        .ctrl-btn-round { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; }
        .seek-bar-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .seek-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6c5ce7, #fd79a8); border-radius: 2px; }

        /* FULL PLAYER OVERLAY */
        .full-player { position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; height: 100vh; background: radial-gradient(circle at top, #242938 0%, #0d0f14 80%); z-index: 300; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); color: #fff; }
        .full-player.open { transform: translateX(-50%) translateY(0); }
        .disc-art { width: 220px; height: 220px; border-radius: 24px; margin: 15px auto; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.7); border: 4px solid rgba(255,255,255,0.1); }

        audio { display: none; }
    </style>
</head>
<body>

<div class="sw-container">
    <div class="top-bar">
        <div class="nav-back-btn tap-animate" onclick="goBackView()">⬅️</div>
        <div class="brand-title">💜 REHAN & JANNAT</div>
        <div style="font-size:12px; color:#a29bfe;">PRO MUSIC</div>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search full song..." onkeypress="if(event.key==='Enter') searchMusic()">
        <button class="search-btn tap-animate" onclick="searchMusic()">Search</button>
    </div>

    <!-- TABS -->
    <div class="tabs-container">
        <div class="tab-btn active" id="tabTrending" onclick="switchTab('trending')">🔥 Trending</div>
        <div class="tab-btn" id="tabLiked" onclick="switchTab('liked')">❤️ Liked Songs</div>
        <div class="tab-btn" id="tabHistory" onclick="switchTab('history')">🕒 History</div>
    </div>

    <div style="margin-bottom: 12px; font-size: 14px; font-weight: 700;" id="statusHeader">Trending Hits</div>

    <div id="songsContainer">
        <div style="text-align:center; padding:30px; color:#a29bfe;">Loading Tracks...</div>
    </div>
</div>

<!-- MINI PLAYER BAR -->
<div class="mini-player-bar" onclick="openFullPlayer()">
    <div class="mini-player-top">
        <div style="width: 55%; min-width: 0;">
            <div class="song-title" id="miniTitle">Select Song</div>
            <div class="song-sub" id="miniArtist">Full Song Streamer</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;" onclick="event.stopPropagation();">
            <div class="ctrl-btn-round tap-animate" onclick="playPrev()">⏮</div>
            <div class="ctrl-btn-round tap-animate" id="miniPlayBtn" onclick="togglePlay()" style="background:#6c5ce7;">▶</div>
            <div class="ctrl-btn-round tap-animate" onclick="playNext()">⏭</div>
        </div>
    </div>
    <div class="seek-bar-container" onclick="event.stopPropagation(); seekAudio(event);">
        <div class="seek-bar-fill" id="miniProgressFill"></div>
    </div>
</div>

<!-- FULL PLAYER OVERLAY -->
<div class="full-player" id="fullPlayerOverlay">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="tap-animate" onclick="closeFullPlayer()" style="font-size:22px; cursor:pointer;">🔻</span>
        <span style="font-size:12px; font-weight:bold; color:#fd79a8; letter-spacing:1px;">NOW PLAYING</span>
        <span class="like-icon" id="fullLikeBtn" onclick="toggleLikeCurrent()" style="font-size:22px;">❤️</span>
    </div>

    <img src="https://via.placeholder.com/220" class="disc-art" id="fullArt">

    <div style="text-align:center;">
        <div id="fullTitle" style="font-size:17px; font-weight:800; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Song Title</div>
        <div id="fullArtist" style="font-size:12px; color:#a29bfe;">Artist Name</div>
    </div>

    <div>
        <div class="seek-bar-container" onclick="seekAudio(event)" style="height:6px; margin-bottom:8px;">
            <div class="seek-bar-fill" id="fullProgressFill"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#8a96a3;">
            <span id="currTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>
    </div>

    <div style="display:flex; justify-content:space-around; align-items:center; margin-bottom:15px;">
        <div class="ctrl-btn-round tap-animate" onclick="playPrev()" style="width:50px; height:50px; font-size:20px;">⏮</div>
        <div class="ctrl-btn-round tap-animate" id="fullPlayBtn" onclick="togglePlay()" style="width:65px; height:65px; font-size:26px; background:linear-gradient(135deg, #6c5ce7, #fd79a8);">▶</div>
        <div class="ctrl-btn-round tap-animate" onclick="playNext()" style="width:50px; height:50px; font-size:20px;">⏭</div>
    </div>
</div>

<audio id="audioPlayer" ontimeupdate="updateProgress()" onloadedmetadata="setDuration()" onended="playNext()"></audio>

<script>
let audio = document.getElementById('audioPlayer');
let playlist = [];
let currentIndex = -1;

let likedSongs = JSON.parse(localStorage.getItem('rehan_liked') || '[]');
let historySongs = JSON.parse(localStorage.getItem('rehan_history') || '[]');

window.onload = () => { loadTrending(); };

document.addEventListener("backbutton", function(e) {
    let overlay = document.getElementById('fullPlayerOverlay');
    if(overlay.classList.contains('open')) {
        e.preventDefault();
        closeFullPlayer();
    } else {
        navigator.app.exitApp();
    }
}, false);

function goBackView() {
    let overlay = document.getElementById('fullPlayerOverlay');
    if(overlay.classList.contains('open')) {
        closeFullPlayer();
    } else {
        switchTab('trending');
    }
}

async function searchSaavn(query) {
    try {
        let res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&limit=20`);
        let data = await res.json();
        if (data && data.data && data.data.results) {
            return data.data.results.map(item => ({
                id: item.id,
                name: item.name,
                artist: item.artists && item.artists.primary ? item.artists.primary[0].name : 'Artist',
                image: item.image && item.image[2] ? item.image[2].url : 'https://via.placeholder.com/150',
                url: item.downloadUrl ? (item.downloadUrl[4] ? item.downloadUrl[4].url : item.downloadUrl[0].url) : ''
            })).filter(s => s.url);
        }
    } catch(e) {}
    return [];
}

async function loadTrending() {
    document.getElementById('statusHeader').textContent = "🔥 Trending Hits";
    let container = document.getElementById('songsContainer');
    container.innerHTML = '<div style="text-align:center; padding:30px; color:#a29bfe;">Loading Tracks...</div>';

    let results = await searchSaavn("top hindi punjabi");
    playlist = results;
    renderSongsList(results);
}

async function searchMusic() {
    let query = document.getElementById('searchInput').value.trim();
    if(!query) return;
    
    document.getElementById('statusHeader').textContent = `Search: "${query}"`;
    let container = document.getElementById('songsContainer');
    container.innerHTML = '<div style="text-align:center; padding:30px; color:#a29bfe;">Searching...</div>';
    
    let results = await searchSaavn(query);
    playlist = results;
    renderSongsList(results);
}

function renderSongsList(items) {
    let container = document.getElementById('songsContainer');
    if(!items || items.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#8a96a3;">No tracks found.</div>';
        return;
    }
    container.innerHTML = '';
    items.forEach((item, idx) => {
        let isLiked = likedSongs.some(s => s.id === item.id);
        let div = document.createElement('div');
        div.className = 'song-card tap-animate';
        div.onclick = () => playSongAtIndex(idx);
        div.innerHTML = `
            <div class="song-info">
                <img src="${item.image}" class="song-cover">
                <div class="song-details">
                    <div class="song-title">${item.name}</div>
                    <div class="song-sub">${item.artist}</div>
                </div>
            </div>
            <div class="song-actions" onclick="event.stopPropagation();">
                <span class="like-icon ${isLiked ? 'active' : ''}" onclick="toggleLike(${JSON.stringify(item).replace(/"/g, '&quot;')}, this)">❤️</span>
            </div>
        `;
        container.appendChild(div);
    });
}

function playSongAtIndex(idx) {
    if(idx < 0 || idx >= playlist.length) return;
    currentIndex = idx;
    let item = playlist[idx];

    if(!historySongs.some(s => s.id === item.id)) {
        historySongs.unshift(item);
        if(historySongs.length > 30) historySongs.pop();
        localStorage.setItem('rehan_history', JSON.stringify(historySongs));
    }

    document.getElementById('miniTitle').textContent = item.name;
    document.getElementById('miniArtist').textContent = item.artist;
    document.getElementById('fullTitle').textContent = item.name;
    document.getElementById('fullArtist').textContent = item.artist;
    document.getElementById('fullArt').src = item.image;

    updateFullLikeState();

    audio.src = item.url;
    audio.play();
    document.getElementById('miniPlayBtn').textContent = '⏸';
    document.getElementById('fullPlayBtn').textContent = '⏸';
}

function playNext() {
    if(playlist.length > 0) {
        let nextIdx = (currentIndex + 1) % playlist.length;
        playSongAtIndex(nextIdx);
    }
}

function playPrev() {
    if(playlist.length > 0) {
        let prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
        playSongAtIndex(prevIdx);
    }
}

function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) {
        audio.play();
        document.getElementById('miniPlayBtn').textContent = '⏸';
        document.getElementById('fullPlayBtn').textContent = '⏸';
    } else {
        audio.pause();
        document.getElementById('miniPlayBtn').textContent = '▶';
        document.getElementById('fullPlayBtn').textContent = '▶';
    }
}

function switchTab(type) {
    document.getElementById('tabTrending').classList.remove('active');
    document.getElementById('tabLiked').classList.remove('active');
    document.getElementById('tabHistory').classList.remove('active');

    if(type === 'trending') {
        document.getElementById('tabTrending').classList.add('active');
        loadTrending();
    } else if(type === 'liked') {
        document.getElementById('tabLiked').classList.add('active');
        document.getElementById('statusHeader').textContent = "❤️ Liked Songs";
        playlist = likedSongs;
        renderSongsList(likedSongs);
    } else if(type === 'history') {
        document.getElementById('tabHistory').classList.add('active');
        document.getElementById('statusHeader').textContent = "🕒 History";
        playlist = historySongs;
        renderSongsList(historySongs);
    }
}

function toggleLike(item, el) {
    let idx = likedSongs.findIndex(s => s.id === item.id);
    if(idx > -1) {
        likedSongs.splice(idx, 1);
        if(el) el.classList.remove('active');
    } else {
        likedSongs.push(item);
        if(el) el.classList.add('active');
    }
    localStorage.setItem('rehan_liked', JSON.stringify(likedSongs));
    updateFullLikeState();
}

function toggleLikeCurrent() {
    if(currentIndex >= 0 && playlist[currentIndex]) {
        toggleLike(playlist[currentIndex], null);
    }
}

function updateFullLikeState() {
    if(currentIndex >= 0 && playlist[currentIndex]) {
        let isLiked = likedSongs.some(s => s.id === playlist[currentIndex].id);
        let fullBtn = document.getElementById('fullLikeBtn');
        if(isLiked) fullBtn.classList.add('active');
        else fullBtn.classList.remove('active');
    }
}

function updateProgress() {
    if (audio.duration) {
        let pct = (audio.currentTime / audio.duration * 100) + '%';
        document.getElementById('miniProgressFill').style.width = pct;
        document.getElementById('fullProgressFill').style.width = pct;
        document.getElementById('currTime').textContent = formatTime(audio.currentTime);
    }
}

function setDuration() { document.getElementById('durTime').textContent = formatTime(audio.duration); }
function formatTime(t) { if(!t) return '0:00'; let m=Math.floor(t/60); let s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s; }

function seekAudio(e) {
    if(!audio.duration) return;
    let rect = e.currentTarget.getBoundingClientRect();
    let clickX = e.clientX - rect.left;
    audio.currentTime = (clickX / rect.width) * audio.duration;
}

function openFullPlayer() { document.getElementById('fullPlayerOverlay').classList.add('open'); }
function closeFullPlayer() { document.getElementById('fullPlayerOverlay').classList.remove('open'); }
</script>
</body>
  </html>
