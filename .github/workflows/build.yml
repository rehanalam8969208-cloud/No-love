name: Build Fixed Pro Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova & Build APK
      run: |
        npm install -g cordova
        cordova create musicapp com.rehan.onlineplayer "REHAN_MUSIC"
        cd musicapp
        cp ../index.html www/index.html
        cp ../config.xml config.xml
        cordova platform add android --skip-link
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: REHAN_PRO_MUSIC_APK
        path: musicapp/platforms/android/app/build/outputs/apk/debug/*.apk
