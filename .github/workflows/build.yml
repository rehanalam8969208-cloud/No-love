name: Build Fixed Pro Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Cordova Android App
      run: |
        cordova create musicapp com.rehan.onlineplayer "REHAN_MUSIC"
        cd musicapp
        cp ../index.html www/index.html
        cp ../config.xml config.xml
        cordova platform add android@12.0.0
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: REHAN_PRO_MUSIC_APK
        path: musicapp/platforms/android/app/build/outputs/apk/debug/*.apk
        
